[project]
name = "backstep-ai"
version = "0.1.0"
description = "Backstep gives AI agents an undo button by recording what data looked like before the agent changed it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "tomlkit>=0.13.0",
    "anthropic>=0.40.0",
    "asyncpg>=0.30.0",
    "sqlglot>=25.0.0",
]

[project.scripts]
backstep = "backstep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "testcontainers[postgres]>=4.8.0",
    "types-docker>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backstep"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mutation: disables one safety mechanism via monkeypatch and asserts the affected scenario/revert now fails instead of refusing correctly; a passing scenario under a mutation guard is a test bug, not a pass",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
